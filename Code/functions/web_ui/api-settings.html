<dialog id="api-settings-dialog" class="api-settings-dialog">
<div class="api-settings-heading"><h2>API 金鑰</h2><button type="button" id="api-settings-close">關閉</button></div>
<p>每個用途設定一把金鑰。金鑰保存在本機，不回傳顯示；儲存不會呼叫模型。</p>
<form id="api-embedding-form" class="api-simple-slot"><h3>Embedding · Voyage</h3><p>模型：voyage-finance-2；本機 BGE 不需要金鑰。</p><label>Embedding API key <input id="api-embedding-key" type="password" autocomplete="new-password" spellcheck="false" maxlength="4096" placeholder="貼上金鑰；留空可保留已設定金鑰"></label><p id="api-embedding-status"></p><button type="submit" id="api-embedding-save">儲存／更新</button><button type="button" id="api-embedding-delete">刪除</button></form>
<form id="api-rerank-form" class="api-simple-slot"><h3>Rerank 重排序 · Voyage</h3><p id="api-rerank-model-label">模型：rerank-3-lite</p><label>Rerank API key <input id="api-rerank-key" type="password" autocomplete="new-password" spellcheck="false" maxlength="4096" placeholder="貼上金鑰；留空可保留已設定金鑰"></label><p id="api-rerank-status"></p><button type="submit" id="api-rerank-save">儲存／更新</button><button type="button" id="api-rerank-delete">刪除</button></form>
<form id="api-answer-form" class="api-simple-slot"><h3>LLM 回答</h3><label>服務商 <select id="api-answer-provider"><option value="gemini">Gemini</option><option value="openai">GPT（OpenAI）</option></select></label><label>模型 ID <input id="api-answer-model" required maxlength="128" placeholder="填入此帳號可用的模型 ID"></label><label>LLM API key <input id="api-answer-key" type="password" autocomplete="new-password" spellcheck="false" maxlength="4096" placeholder="切換服務商時需輸入對應金鑰"></label><p id="api-answer-status"></p><button type="submit" id="api-answer-save">儲存／更新</button><button type="button" id="api-answer-delete">刪除</button></form>
<p id="api-settings-message" role="status"></p>
</dialog>
